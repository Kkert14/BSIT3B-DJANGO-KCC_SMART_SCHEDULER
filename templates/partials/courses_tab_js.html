<script>
(function() {
  const modalEl = document.getElementById('subjectModal');
  const deleteModalEl = document.getElementById('deleteSubjectModal');
  const form = document.getElementById('subjectForm');
  const alertBox = document.getElementById('subjectAlert');
  const title = document.getElementById('subjectModalTitle');
  const submitBtn = document.getElementById('subjectSubmitBtn');
  const deleteBtn = document.getElementById('confirmDeleteSubjectBtn');
  const deleteName = document.getElementById('deleteSubjectName');
  let currentId = null;

  document.querySelectorAll('#subjectToastContainer .toast').forEach(function(toastEl) {
    bootstrap.Toast.getOrCreateInstance(toastEl).show();
  });

  function resetForm() {
    form.reset();
    document.getElementById('subject_id').value = '';
    title.textContent = 'Add Course';
    submitBtn.textContent = 'Save Course';
    alertBox.classList.add('d-none');
    alertBox.textContent = '';
    currentId = null;
  }

  modalEl.addEventListener('show.bs.modal', function(event) {
    const button = event.relatedTarget;
    if (!button) {
      resetForm();
      return;
    }
    const mode = button.getAttribute('data-mode');
    if (mode === 'edit') {
      title.textContent = 'Edit Course';
      submitBtn.textContent = 'Update Course';
      currentId = button.getAttribute('data-id');
      document.getElementById('subject_id').value = currentId;
      document.getElementById('subject_program').value = button.getAttribute('data-program');
      document.getElementById('subject_code').value = button.getAttribute('data-code');
      document.getElementById('subject_name').value = button.getAttribute('data-name');
      document.getElementById('subject_units').value = button.getAttribute('data-units');
      document.getElementById('subject_total_hours').value = button.getAttribute('data-total-hours');
      document.getElementById('subject_is_lab').checked = button.getAttribute('data-is-lab') === 'true';
      document.getElementById('subject_year_level').value = button.getAttribute('data-year-level');
      document.getElementById('subject_semester').value = button.getAttribute('data-semester');
      document.getElementById('subject_prerequisite').value = button.getAttribute('data-prerequisite');
    } else {
      resetForm();
    }
  });

  deleteModalEl.addEventListener('show.bs.modal', function(event) {
    const button = event.relatedTarget;
    if (button) {
      currentId = button.getAttribute('data-id');
      deleteName.textContent = button.getAttribute('data-code');
    }
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(form);

    fetch('{% url "subject:subject_save_ajax" %}', {
      method: 'POST',
      headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        alertBox.textContent = data.error;
        alertBox.classList.remove('d-none');
        return;
      }
      window.location.reload();
    })
    .catch(() => {
      alertBox.textContent = 'Something went wrong.';
      alertBox.classList.remove('d-none');
    });
  });

  deleteBtn.addEventListener('click', function() {
    if (!currentId) return;
    fetch('/subjects/ajax/delete/' + currentId + '/', {
      method: 'POST',
      headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value}
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'deleted') {
        window.location.reload();
      }
    });
  });

  // Import Excel
  const importForm = document.getElementById('subjectImportForm');
  const importError = document.getElementById('subjectImportError');
  const importResult = document.getElementById('subjectImportResult');
  const importBtn = document.getElementById('subjectImportBtn');

  if (importForm) {
    importForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(importForm);
      importBtn.disabled = true;
      importError.classList.add('d-none');
      importResult.classList.add('d-none');
      importError.textContent = '';
      importResult.textContent = '';

      fetch('{% url "subject:subject_import_excel" %}', {
        method: 'POST',
        headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        importBtn.disabled = false;
        if (data.error) {
          importError.textContent = data.error;
          importError.classList.remove('d-none');
          return;
        }
        importResult.innerHTML = '<strong>Import complete!</strong> Created: ' + data.created;
        if (data.errors && data.errors.length) {
          importResult.innerHTML += '<br><strong>Errors:</strong><br>' + data.errors.join('<br>');
        }
        importResult.classList.remove('d-none');
        setTimeout(() => {
          bootstrap.Modal.getInstance(document.getElementById('subjectImportModal')).hide();
          window.location.reload();
        }, 2000);
      })
      .catch(() => {
        importBtn.disabled = false;
        importError.textContent = 'Something went wrong.';
        importError.classList.remove('d-none');
      });
    });
  }
})();
</script>
