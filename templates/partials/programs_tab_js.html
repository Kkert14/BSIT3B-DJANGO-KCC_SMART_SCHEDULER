<script>
(function() {
  const modalEl = document.getElementById('programModal');
  const deleteModalEl = document.getElementById('deleteProgramModal');
  const form = document.getElementById('programForm');
  const alertBox = document.getElementById('programAlert');
  const title = document.getElementById('programModalTitle');
  const submitBtn = document.getElementById('programSubmitBtn');
  const deleteBtn = document.getElementById('confirmDeleteProgramBtn');
  const deleteName = document.getElementById('deleteProgramName');
  let currentId = null;

  document.querySelectorAll('#programToastContainer .toast').forEach(function(toastEl) {
    bootstrap.Toast.getOrCreateInstance(toastEl).show();
  });

  function clearCustomOptions(select) {
    Array.prototype.slice.call(select.querySelectorAll('option[data-custom]')).forEach(function(opt) {
      opt.remove();
    });
  }

  // Keep a stored value that is not in the preset list selectable.
  function setSelectValue(select, value) {
    clearCustomOptions(select);
    if (!value) {
      select.value = '';
      return;
    }
    const exists = Array.prototype.some.call(select.options, function(opt) {
      return opt.value === value;
    });
    if (!exists) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      option.setAttribute('data-custom', '1');
      select.appendChild(option);
    }
    select.value = value;
  }

  function resetForm() {
    form.reset();
    document.getElementById('program_id').value = '';
    clearCustomOptions(document.getElementById('program_major'));
    title.textContent = 'Add Program';
    submitBtn.textContent = 'Save Program';
    alertBox.classList.add('d-none');
    alertBox.textContent = '';
    currentId = null;
    document.getElementById('program_is_active').checked = true;
  }

  modalEl.addEventListener('show.bs.modal', function(event) {
    const button = event.relatedTarget;
    if (!button) {
      resetForm();
      return;
    }
    const mode = button.getAttribute('data-mode');
    if (mode === 'edit') {
      title.textContent = 'Edit Program';
      submitBtn.textContent = 'Update Program';
      currentId = button.getAttribute('data-id');
      document.getElementById('program_id').value = currentId;
      document.getElementById('program_program_code').value = button.getAttribute('data-program-code');
      document.getElementById('program_program_description').value = button.getAttribute('data-program-description');
      setSelectValue(document.getElementById('program_major'), button.getAttribute('data-major'));
      document.getElementById('program_department').value = button.getAttribute('data-department') || '';
      document.getElementById('program_is_active').checked = button.getAttribute('data-active') === 'true';
    } else {
      resetForm();
    }
  });

  deleteModalEl.addEventListener('show.bs.modal', function(event) {
    const button = event.relatedTarget;
    if (button) {
      currentId = button.getAttribute('data-id');
      deleteName.textContent = button.getAttribute('data-program-code');
    }
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(form);
    formData.set('is_active', document.getElementById('program_is_active').checked ? 'true' : 'false');

    fetch('{% url "program:program_save_ajax" %}', {
      method: 'POST',
      headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        alertBox.textContent = data.error;
        alertBox.classList.remove('d-none');
        return;
      }
      window.location.reload();
    })
    .catch(() => {
      alertBox.textContent = 'Something went wrong.';
      alertBox.classList.remove('d-none');
    });
  });

  deleteBtn.addEventListener('click', function() {
    if (!currentId) return;
    fetch('/programs/ajax/delete/' + currentId + '/', {
      method: 'POST',
      headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value}
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'deleted') {
        window.location.reload();
      }
    });
  });

  // Program courses modal
  const coursesModalEl = document.getElementById('programCoursesModal');
  const coursesBody = document.getElementById('programCoursesBody');
  const coursesTitle = document.getElementById('programCoursesTitle');
  const coursesSubtitle = document.getElementById('programCoursesSubtitle');
  let coursesUrl = null;
  let coursesRequest = 0;
  let deleteCourseId = null;

  function setCourseView(view) {
    coursesBody.querySelectorAll('[data-course-view]').forEach(function(panel) {
      panel.classList.toggle('d-none', panel.getAttribute('data-course-view') !== view);
    });
  }

  function showCoursesFlash(message) {
    const alert = document.createElement('div');
    alert.className = 'alert alert-success d-flex align-items-center mb-3';
    alert.setAttribute('role', 'status');
    const icon = document.createElement('i');
    icon.className = 'fas fa-circle-check me-2';
    const text = document.createElement('div');
    text.textContent = message;
    alert.appendChild(icon);
    alert.appendChild(text);
    coursesBody.prepend(alert);
    window.setTimeout(function() {
      alert.remove();
    }, 4000);
  }

  function loadProgramCourses(after) {
    if (!coursesUrl) return;
    const params = new URLSearchParams();
    ['year', 'semester', 'year_level'].forEach(function(name) {
      const select = coursesBody.querySelector('select[name="' + name + '"]');
      if (select) params.set(name, select.value);
    });

    const requestId = ++coursesRequest;
    coursesBody.setAttribute('aria-busy', 'true');
    fetch(coursesUrl + '?' + params.toString())
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (requestId !== coursesRequest) return;
        coursesBody.innerHTML = data.html;
        coursesBody.removeAttribute('aria-busy');
        if (after) after();
      })
      .catch(function() {
        if (requestId !== coursesRequest) return;
        coursesBody.removeAttribute('aria-busy');
        coursesBody.innerHTML = '<div class="alert alert-danger mb-0">Unable to load this program\'s courses.</div>';
      });
  }

  coursesModalEl.addEventListener('show.bs.modal', function(event) {
    const button = event.relatedTarget;
    if (!button) return;
    coursesUrl = button.getAttribute('data-course-url');
    coursesTitle.textContent = button.getAttribute('data-program-code') + ' curriculum';
    coursesSubtitle.textContent = button.getAttribute('data-program-name') || '';
    coursesBody.innerHTML = '<div class="text-muted small py-3">Loading courses…</div>';
    loadProgramCourses();
  });

  coursesBody.addEventListener('change', function(event) {
    if (event.target.matches('select[data-course-filter]')) loadProgramCourses();
  });

  function resetPrerequisiteOptions(courseForm) {
    const select = courseForm.elements.prerequisite;
    if (!select) return;
    Array.prototype.forEach.call(select.options, function(option) {
      option.disabled = false;
    });
  }

  function prefillFromFilters(courseForm) {
    const yearSelect = coursesBody.querySelector('select[name="year"]');
    const semesterSelect = coursesBody.querySelector('select[name="semester"]');
    const yearLevelSelect = coursesBody.querySelector('select[name="year_level"]');

    if (yearLevelSelect && yearLevelSelect.value) {
      courseForm.elements.year_level.value = yearLevelSelect.value;
    }

    const options = courseForm.elements.semester.options;
    let match = null;
    if (yearSelect && yearSelect.value) {
      match = Array.prototype.find.call(options, function(option) {
        return option.getAttribute('data-curriculum') === yearSelect.value
          && (!semesterSelect || !semesterSelect.value
            || option.getAttribute('data-semester-number') === semesterSelect.value);
      });
    } else if (semesterSelect && semesterSelect.value) {
      match = Array.prototype.find.call(options, function(option) {
        return option.getAttribute('data-semester-number') === semesterSelect.value;
      });
    }
    if (match) courseForm.elements.semester.value = match.value;
  }

  function openCourseForm(button) {
    const courseForm = coursesBody.querySelector('[data-course-form]');
    if (!courseForm) return;
    courseForm.reset();
    resetPrerequisiteOptions(courseForm);
    courseForm.querySelector('[data-course-error]').classList.add('d-none');
    courseForm.querySelector('[data-course-error]').textContent = '';

    const formTitle = coursesBody.querySelector('[data-course-form-title]');
    const submit = coursesBody.querySelector('[data-course-submit]');
    const idInput = courseForm.querySelector('[data-course-id]');

    if (button) {
      const id = button.getAttribute('data-id');
      idInput.value = id;
      courseForm.elements.code.value = button.getAttribute('data-code');
      courseForm.elements.name.value = button.getAttribute('data-name');
      courseForm.elements.units.value = button.getAttribute('data-units');
      courseForm.elements.total_hours.value = button.getAttribute('data-total-hours');
      courseForm.elements.is_lab.checked = button.getAttribute('data-is-lab') === 'true';
      courseForm.elements.semester.value = button.getAttribute('data-semester');
      courseForm.elements.year_level.value = button.getAttribute('data-year-level');
      courseForm.elements.prerequisite.value = button.getAttribute('data-prerequisite');
      const selfOption = courseForm.elements.prerequisite.querySelector('option[value="' + id + '"]');
      if (selfOption) selfOption.disabled = true;
      formTitle.textContent = 'Edit Course';
      submit.textContent = 'Update Course';
    } else {
      idInput.value = '';
      prefillFromFilters(courseForm);
      formTitle.textContent = 'Add Course';
      submit.textContent = 'Save Course';
    }

    setCourseView('form');
    courseForm.elements.code.focus();
  }

  function openCourseDelete(button) {
    deleteCourseId = button.getAttribute('data-id');
    coursesBody.querySelector('[data-course-delete-name]').textContent = button.getAttribute('data-code');
    setCourseView('delete');
  }

  function saveCourse(courseForm) {
    const errorBox = courseForm.querySelector('[data-course-error]');
    const submit = courseForm.querySelector('[data-course-submit]');
    const formData = new FormData(courseForm);
    const defaultLabel = submit.textContent;

    errorBox.classList.add('d-none');
    submit.disabled = true;
    submit.textContent = 'Saving…';

    fetch('{% url "subject:subject_save_ajax" %}', {
      method: 'POST',
      headers: {'X-CSRFToken': courseForm.querySelector('[name=csrfmiddlewaretoken]').value},
      body: formData
    })
    .then(function(response) {
      return response.json().then(function(data) {
        return {ok: response.ok, data: data};
      });
    })
    .then(function(result) {
      if (!result.ok || result.data.error) {
        errorBox.textContent = result.data.error || 'Could not save the course.';
        errorBox.classList.remove('d-none');
        return;
      }
      loadProgramCourses(function() {
        showCoursesFlash('Course "' + result.data.code + '" saved.');
      });
    })
    .catch(function() {
      errorBox.textContent = 'Something went wrong.';
      errorBox.classList.remove('d-none');
    })
    .finally(function() {
      submit.disabled = false;
      submit.textContent = defaultLabel;
    });
  }

  function confirmDeleteCourse() {
    if (!deleteCourseId) return;
    fetch('/subjects/ajax/delete/' + deleteCourseId + '/', {
      method: 'POST',
      headers: {'X-CSRFToken': coursesBody.querySelector('[name=csrfmiddlewaretoken]').value}
    })
    .then(function(response) {
      return response.json().then(function(data) {
        return {ok: response.ok, data: data};
      });
    })
    .then(function(result) {
      if (!result.ok || result.data.error) {
        showCoursesFlash(result.data.error || 'Could not delete the course.');
        return;
      }
      deleteCourseId = null;
      loadProgramCourses(function() {
        showCoursesFlash('Course deleted.');
      });
    });
  }

  coursesBody.addEventListener('click', function(event) {
    const add = event.target.closest('[data-course-add]');
    if (add) {
      openCourseForm(null);
      return;
    }
    const edit = event.target.closest('[data-course-edit]');
    if (edit) {
      openCourseForm(edit);
      return;
    }
    const remove = event.target.closest('[data-course-delete]');
    if (remove) {
      openCourseDelete(remove);
      return;
    }
    const cancel = event.target.closest('[data-course-cancel]');
    if (cancel) {
      setCourseView('list');
      return;
    }
    if (event.target.closest('[data-course-delete-confirm]')) {
      confirmDeleteCourse();
    }
  });

  coursesBody.addEventListener('submit', function(event) {
    const courseForm = event.target.closest('[data-course-form]');
    if (!courseForm) return;
    event.preventDefault();
    saveCourse(courseForm);
  });
})();
</script>
